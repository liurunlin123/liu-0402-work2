<main class="shell intro"><span class="eyebrow">OPEN REHEARSAL / 活动介绍</span><h1>开放排练：一起听见第一拍</h1><p class="lead">第 8 周 · 艺术活动室 · 零基础可旁听或体验</p><img src="violin-rehearsal.jpg" width="1500" height="1000" alt="同学们在校园排练室进行小提琴合奏的情景创作">
<h2>活动内容</h2><p>先看合奏成员如何调弦、摆放谱架并一起数拍，再听两个声部如何组合成一段旋律。体验环节从空弦长音开始，愿意尝试的同学可以跟随领练，在同一拍上起弓、收弓。</p><h2>到场准备</h2><p>有乐器可以带琴和肩托；没有乐器也欢迎旁听。请提前到场并留出拉弓空间，提问安排在段落间歇。以上为课程作业示例安排。</p><div class="actions"><a class="button dark" href="liu-0402-work2.html">← 返回小提琴社招新网页</a><a class="button ghost" href="liu-0402-work2.html#join">查看报名表 ↗</a></div></main><footer><div class="shell">弦语小提琴社 · 活动介绍</div></footer></body></html>
